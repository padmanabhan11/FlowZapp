# DigitalOcean App Platform spec — 03-Technical-Architecture §9.
# Production app spec. Generated from app.yaml the first time; keep both in step (CI diffs them).
# Secrets are App Platform encrypted env vars, never in the repo.
name: flowzapp-production
region: nyc

# App-level env vars apply to every component (web, workers, scheduler, the
# migrate job): the index worker and `vector:ensure-collection` need the same
# database, queue, Spaces, model and vector-store settings as the API.
envs:
  - key: APP_ENV
    value: production
  - key: APP_KEY
    type: SECRET
  - key: DB_CONNECTION
    value: mysql
  - key: DATABASE_URL
    value: ${mysql.DATABASE_URL}
  - key: MYSQL_ATTR_SSL_CA
    value: ${mysql.CA_CERT}
  - key: REDIS_URL
    value: ${valkey.REDIS_URL}
  - key: CACHE_STORE
    value: redis
  - key: QUEUE_CONNECTION
    value: redis
  - key: SESSION_DRIVER
    value: redis
  - key: FILESYSTEM_DISK
    value: spaces
  - key: DO_SPACES_KEY
    type: SECRET
  - key: DO_SPACES_SECRET
    type: SECRET
  - key: DO_SPACES_BUCKET
    value: flowzapp-production
  - key: DO_SPACES_REGION
    value: nyc3
  - key: ANTHROPIC_API_KEY
    type: SECRET
  - key: SENTRY_LARAVEL_DSN
    type: SECRET
  # Retrieval (decisions 21 Sep 2026): OpenAI embeddings + self-hosted Qdrant (infra/qdrant).
  - key: EMBEDDINGS_DRIVER
    value: openai
  - key: OPENAI_API_KEY
    type: SECRET
  - key: VECTOR_DRIVER
    value: qdrant
  - key: QDRANT_URL
    value: https://qdrant.example.com    # the droplet's TLS endpoint (infra/qdrant/README.md)
  - key: QDRANT_API_KEY
    type: SECRET
  - key: QDRANT_COLLECTION
    value: flowzapp-production
  # Billing: the provider is an open decision; 'null' answers 501 on self-service changes until a driver exists.
  - key: BILLING_DRIVER
    value: "null"
  - key: BILLING_WEBHOOK_SECRET
    type: SECRET
  # Operator alerts (infra/runbooks): the `alerts` log channel posts to Slack when this is set.
  - key: LOG_SLACK_WEBHOOK_URL
    type: SECRET
  # Error tracking (M4-T1). SENTRY_RELEASE is set by the CD workflow from the commit on every deploy.
  - key: SENTRY_RELEASE
    value: unset
  - key: SENTRY_ENVIRONMENT
    value: production
  - key: SENTRY_DSN_WEB
    type: SECRET
  - key: METRICS_TOKEN
    type: SECRET

# Platform alerts to the account's alert email (component/deploy level; product alerts are in infra/runbooks).
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - name: mysql
    engine: MYSQL
    version: "8"
    production: true          # managed cluster; TLS required
  - name: valkey
    engine: VALKEY
    version: "8"
    production: true

services:
  - name: web
    # Laravel API. PHP buildpack; FFmpeg is NOT needed here (only on workers).
    source_dir: api
    github:
      repo: OWNER/FlowZapp
      branch: main
      deploy_on_push: false   # production deploys only through the gated CD job
    build_command: composer install --no-dev --optimize-autoloader --no-interaction
    run_command: heroku-php-apache2 public/
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 2
    http_port: 8080
    routes:
      - path: /api
        preserve_path_prefix: true   # Laravel routes are /api/v1/...; the health check hits /up on the container directly
    health_check:
      http_path: /up

workers:
  - name: worker-pipeline
    # Stages 1–4 (transcribe, segment, frames, generate). Needs FFmpeg, so this
    # component builds from a Dockerfile rather than the PHP buildpack — see
    # api/Dockerfile.worker once the pipeline lands (03 §5).
    source_dir: api
    github:
      repo: OWNER/FlowZapp
      branch: main
    dockerfile_path: api/Dockerfile.worker
    run_command: php artisan queue:work redis --queue=pipeline --tries=3 --timeout=3600 --max-jobs=50
    instance_size_slug: apps-s-2vcpu-4gb
    instance_count: 1

  - name: worker-default
    # Notifications, invites, nudges, and the `index` queue (stage 5).
    source_dir: api
    github:
      repo: OWNER/FlowZapp
      branch: main
    build_command: composer install --no-dev --optimize-autoloader --no-interaction
    run_command: php artisan queue:work redis --queue=default,index --tries=3 --timeout=600
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1

  - name: scheduler
    # Runs routes/console.php: review-due (daily), weekly digest, scheduled workspace purge,
    # stale-upload cleanup, and the retrieval index monitor every 10 minutes (G1-T5).
    source_dir: api
    github:
      repo: OWNER/FlowZapp
      branch: main
    build_command: composer install --no-dev --optimize-autoloader --no-interaction
    run_command: php artisan schedule:work
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: api
    github:
      repo: OWNER/FlowZapp
      branch: main
    build_command: composer install --no-dev --optimize-autoloader --no-interaction
    run_command: php artisan migrate --force && php artisan vector:ensure-collection

static_sites:
  - name: app
    source_dir: web
    github:
      repo: OWNER/FlowZapp
      branch: main
    build_command: npm ci --legacy-peer-deps && node scripts/write-env.mjs && npm run build   # write-env bakes the Sentry DSN/release (M4-T1)
    output_dir: dist/web/browser
    catchall_document: index.html
    routes:
      - path: /
