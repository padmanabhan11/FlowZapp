#cloud-config
# First-boot setup for the Qdrant droplet (Ubuntu 24.04). Pass with
#   doctl compute droplet create ... --user-data-file infra/qdrant/cloud-init.yaml
# The block-storage volume is attached separately and mounted at /mnt/qdrant.
package_update: true
packages: [docker.io, docker-compose-v2, awscli, python3, unattended-upgrades, fail2ban]
runcmd:
  - systemctl enable --now docker
  - mkdir -p /opt/flowzapp-qdrant /mnt/qdrant/storage /mnt/qdrant/snapshots
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - echo '30 2 * * * root /opt/flowzapp-qdrant/backup.sh >> /var/log/qdrant-backup.log 2>&1' > /etc/cron.d/qdrant-backup
