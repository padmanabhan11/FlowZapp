name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — style, static analysis, tenancy suite, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, intl, zip, gd
          coverage: none
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Environment
        run: cp .env.example .env && php artisan key:generate --force
      - name: Raw / unscoped query check
        run: php scripts/check-raw-queries.php
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Tenancy suite (schema conformance + cross-tenant isolation)
        run: php artisan test --filter Tenancy
      - name: Full test suite
        run: php artisan test

  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build
