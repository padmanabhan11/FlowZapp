<style>
:root{
  --ink:#1E2761; --ink-soft:#5B6B7C; --paper:#FFFFFF; --rail:#F2F4F6; --brand-gold:#D9A441;
  --line:#DDE2E7; --line-soft:#EBEEF1;
  --draft:#B8730B; --review:#1F5C99; --approved:#2F6F4E; --archived:#8A94A0;
  --danger:#A32B2B;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:#E9ECEF;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- prototype chrome ---------- */
.proto-bar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.proto-bar h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.proto-bar .sub{font-size:12px;opacity:.62}
.picker{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.picker button{background:transparent;border:1px solid rgba(255,255,255,.24);color:#fff;padding:4px 9px;border-radius:4px;font-size:11.5px;opacity:.8}
.picker button:hover{opacity:1;border-color:rgba(255,255,255,.5)}
.picker button[aria-current="true"]{background:#fff;color:var(--ink);border-color:#fff;opacity:1;font-weight:600}

.stage{max-width:1180px;margin:26px auto 60px;padding:0 20px}
.screen-head{margin:0 0 10px}
.screen-head h2{font-size:17px;margin:0 0 3px;letter-spacing:-.015em}
.screen-head p{margin:0;color:#55616E;font-size:13px;max-width:74ch}
.frame{background:var(--paper);border:1px solid #C9CFD6;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(20,32,46,.07)}
.note{margin:12px 0 0;padding:11px 14px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:0 4px 4px 0;font-size:12.5px;color:#42505E;max-width:82ch}
.note b{color:var(--ink)}
.screen{display:none}
.screen.on{display:block}

/* ---------- app shell ---------- */
.top{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:14px;background:var(--paper)}
.ws{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.ws .mark{width:24px;height:24px;border-radius:5px;flex:none;display:block;object-fit:contain}

.omni{flex:1;max-width:440px;border:1px solid var(--line);border-radius:4px;padding:6px 11px;color:#8A94A0;font-size:12.5px;background:#FCFDFD}
.avatar{width:25px;height:25px;border-radius:50%;background:var(--rail);border:1px solid var(--line);margin-left:auto;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-soft)}
.body{display:flex;min-height:560px}
.side{width:186px;flex:none;border-right:1px solid var(--line);background:var(--rail);padding:10px 0;font-size:12.5px}
.side a{display:block;padding:5px 14px;color:#3C4A58;text-decoration:none}
.side a:hover{background:#E8ECEF}
.side a.sel{background:#E2E7EB;color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--ink)}
.side .grp{padding:11px 14px 3px;font-size:10.5px;color:#939DA8;letter-spacing:.02em}
.side .kid{padding-left:27px;color:#55616E}
.side hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.main{flex:1;min-width:0;background:var(--paper);overflow:hidden}

/* ---------- state pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.p-appr{color:var(--approved);border-color:#BEDACB;background:#F1F8F4}
.p-draft{color:var(--draft);border-color:#EBD5AE;background:#FDF7EC}
.p-rev{color:var(--review);border-color:#C2D6E9;background:#EFF5FA}
.p-arch{color:var(--archived);border-color:var(--line);background:#F7F8F9}

/* ---------- generic ---------- */
.pad{padding:22px 26px}
.h{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0 0 3px}
.sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px}
.mono{font-family:var(--mono);font-size:11.5px}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:4px;padding:6px 13px;font-size:12.5px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:#B6BEC7}
.btn:disabled{opacity:.34;cursor:not-allowed}
.row{display:flex;align-items:center;gap:9px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:#4A5765;padding:8px 12px;border-bottom:1px solid var(--line);background:#F8FAFB;font-size:11.5px}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft)}
tr:hover td{background:#FAFBFC}
.muted{color:var(--ink-soft)}

/* ---------- S4 first run ---------- */
.firstrun{display:flex;flex-direction:column;align-items:center;justify-content:center;height:560px;text-align:center;padding:0 30px}
.firstrun h2{font-size:27px;font-weight:600;letter-spacing:-.03em;margin:0 0 9px}
.firstrun p{color:var(--ink-soft);max-width:44ch;margin:0 0 26px;font-size:14px}
.rec-btn{background:var(--ink);color:#fff;border:none;border-radius:5px;padding:13px 26px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#E5534B}
.egs{margin-top:30px;color:#7C8794;font-size:12.5px;line-height:2}
.egs span{color:var(--ink);border-bottom:1px solid var(--line)}
.firstrun .alt{margin-top:24px;font-size:12.5px;color:var(--ink-soft)}
.firstrun .alt a{color:var(--ink)}

/* ---------- S7 reader ---------- */
.reader{max-width:720px;margin:0 auto;padding:26px 30px 60px}
.ctrl-block{border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:22px}
.crumb{font-size:11px;color:#8A94A0;margin-bottom:6px}
.ctrl-block h1{font-size:26px;letter-spacing:-.025em;margin:0 0 11px;font-weight:600}
.ctrl-meta{display:flex;flex-wrap:wrap;gap:7px 15px;align-items:center;font-size:11.5px;color:var(--ink-soft)}
.ctrl-meta .k{font-family:var(--mono);font-size:11px;color:var(--ink)}
.sec{margin-bottom:20px}
.sec h3{font-size:11.5px;color:#7C8794;font-weight:600;margin:0 0 5px}
.sec p{margin:0;font-size:13.5px;line-height:1.62}
.steps{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.step{display:flex;gap:15px;margin-bottom:22px}
.step .n{flex:none;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.step .c{flex:1;min-width:0}
.step .c p{margin:0 0 7px;font-size:13.5px;line-height:1.62}
.shot{height:104px;background:#EFF2F4;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;color:#A4AEB8;font-size:11px}
.step.crit .c{border-left:2px solid var(--draft);padding-left:13px;margin-left:-2px}
.step.crit .warn{font-size:11.5px;color:var(--draft);font-weight:600;margin-top:6px}
.srcline{margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
.srcline a{color:var(--ink)}

/* ---------- S9 draft review ---------- */
.dr{display:flex;height:560px}
.dr-l{width:50%;border-right:1px solid var(--line);background:#F8FAFB;padding:16px;display:flex;flex-direction:column}
.video{flex:1;background:#1B2733;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#6E7E8E;font-size:12px;min-height:210px;position:relative}
.scrub{margin-top:13px}
.scrub .track{display:flex;gap:2px;height:26px}
.scrub .seg{flex:1;background:#DFE4E9;border-radius:2px;position:relative;cursor:pointer}
.scrub .seg:hover{background:#CBD3DA}
.scrub .seg.act{background:var(--ink)}
.scrub .seg span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10px;color:#7A8794}
.scrub .seg.act span{color:#fff}
.scrub .tl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:#8A94A0;margin-top:5px}
.dr-r{width:50%;display:flex;flex-direction:column}
.dr-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vcount{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-left:auto}
.dr-body{flex:1;overflow-y:auto;padding:14px 16px}
.dstep{border:1px solid var(--line);border-radius:4px;padding:11px 13px;margin-bottom:9px}
.dstep.act{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dstep .t{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dstep .num{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.dstep .ts{font-family:var(--mono);font-size:10.5px;color:#8A94A0;margin-left:auto}
.dstep p{margin:0;font-size:12.5px;line-height:1.55}
.vbtn{margin-top:8px;background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px 9px;font-size:11px;color:var(--ink-soft)}
.vbtn:hover{border-color:var(--ink);color:var(--ink)}
.vbtn.done{border-color:#BEDACB;background:#F1F8F4;color:var(--approved);font-weight:600}
.lowconf{font-size:11px;color:var(--draft);margin-top:6px;font-weight:600}
.dr-foot{padding:11px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#FAFBFC}
.dr-foot .hint{font-size:11.5px;color:var(--ink-soft)}

/* ---------- S15 ask ---------- */
.ask{max-width:660px;margin:0 auto;padding:26px 24px}
.q{font-size:15px;font-weight:600;margin:0 0 16px;letter-spacing:-.01em}
.ans{font-size:13.5px;line-height:1.68}
.ans p{margin:0 0 11px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#F1F4F6;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:11px;color:var(--ink);text-decoration:none;white-space:nowrap}
.chip .s{font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.srcs{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.srcs h4{font-size:11.5px;color:#7C8794;margin:0 0 8px;font-weight:600}
.src{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px}
.rate{margin-top:16px;display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--ink-soft)}
.rate button{border:1px solid var(--line);background:transparent;border-radius:3px;padding:2px 9px;font-size:12px}
.refusal{border:1px solid #EBD5AE;background:#FDF9F1;border-radius:4px;padding:16px 18px;margin-top:26px}
.refusal .rh{font-weight:600;font-size:13.5px;margin:0 0 7px;color:var(--draft)}
.refusal p{margin:0 0 12px;font-size:13px;line-height:1.6;color:#4A5765}

/* ---------- S20 gaps ---------- */
.gap{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.gap .cnt{font-family:var(--mono);font-size:12px;color:var(--ink-soft);width:34px;flex:none}
.gap .qq{flex:1;font-size:13px}
.bars{display:flex;gap:20px;margin-top:24px;flex-wrap:wrap}
.bar-g{flex:1;min-width:180px}
.bar-g h4{font-size:11.5px;color:#7C8794;margin:0 0 10px;font-weight:600}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px}
.bar .l{width:74px;color:var(--ink-soft);flex:none}
.bar .t{flex:1;height:15px;background:#F0F3F5;border-radius:2px;overflow:hidden}
.bar .f{height:100%;display:block;border-radius:2px}
.bar .v{width:26px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}

/* ---------- search ---------- */
.res{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.res h4{margin:0 0 4px;font-size:14px;font-weight:600}
.res p{margin:0 0 6px;font-size:12.5px;color:#4A5765;line-height:1.55}
.res .m{font-size:11.5px;color:var(--ink-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.instant{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:0 4px 4px 0;padding:14px 16px;background:#FAFBFC;margin-bottom:8px}
.instant p{margin:0 0 9px;font-size:13.5px;line-height:1.62}

/* ---------- perms ---------- */
.insp{border:1px solid var(--line);border-radius:4px;padding:15px 17px;background:#FAFBFC;margin-top:20px}
.insp h4{margin:0 0 11px;font-size:13px;font-weight:600}
.why{display:flex;gap:11px;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--line-soft)}
.why .src-t{font-size:11px;color:var(--ink-soft);width:118px;flex:none}

/* ---------- history ---------- */
.hist{display:flex;height:560px}
.hist-l{width:250px;border-right:1px solid var(--line);overflow-y:auto}
.vrow{padding:11px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12.5px}
.vrow:hover{background:#FAFBFC}
.vrow.sel{background:#F1F4F6;box-shadow:inset 2px 0 0 var(--ink)}
.vrow .vn{font-family:var(--mono);font-size:11.5px;color:var(--ink);font-weight:600}
.vrow .vm{color:var(--ink-soft);font-size:11.5px;margin-top:2px}
.hist-r{flex:1;padding:20px 24px;overflow-y:auto}
.dl{padding:8px 11px;border-radius:3px;margin-bottom:5px;font-size:12.5px;line-height:1.55;border-left:2px solid transparent}
.dl.add{background:#F1F8F4;border-left-color:var(--approved)}
.dl.del{background:#FBF2F2;border-left-color:var(--danger);text-decoration:line-through;color:#8A7373}
.dl.mov{background:#EFF5FA;border-left-color:var(--review)}
.dl .tag{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-right:8px}

/* ---------- recordings ---------- */
.prog{width:90px;height:5px;background:#E6EAEE;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;border-radius:3px;height:100%;background:var(--ink)}
.fail{color:var(--danger);font-size:11.5px;margin-top:3px}

/* ---------- editor ---------- */
.ed-top{border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:11px;font-size:12.5px}
.saved{margin-left:auto;color:var(--ink-soft);font-size:11.5px}
.banner{background:#FDF7EC;border-bottom:1px solid #EBD5AE;padding:9px 16px;font-size:12.5px;color:#7A5410}
.banner b{color:#5E400C}
.ed-canvas{max-width:660px;margin:0 auto;padding:22px 20px}
.slot{border:1px dashed var(--line);border-radius:3px;padding:10px 12px;margin-bottom:11px}
.slot .sl{font-size:10.5px;color:#939DA8;margin-bottom:3px}
.slot p{margin:0;font-size:13px}
.estep{display:flex;gap:11px;align-items:flex-start;padding:8px;border-radius:3px;margin-bottom:3px}
.estep:hover{background:#F8FAFB}
.grip{color:#C2CAD2;font-size:13px;cursor:grab;line-height:1.3;flex:none;width:11px}
.estep .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);flex:none;width:16px;padding-top:1px}
.estep .txt{flex:1;font-size:13px;line-height:1.55}
.acts{display:flex;gap:5px;opacity:0}
.estep:hover .acts{opacity:1}
.acts button{border:1px solid var(--line);background:#fff;border-radius:3px;padding:1px 6px;font-size:10.5px;color:var(--ink-soft)}

@media(max-width:900px){
  .dr,.hist{flex-direction:column;height:auto}
  .dr-l,.dr-r,.hist-l{width:100%;border-right:none;border-bottom:1px solid var(--line)}
  .side{display:none}
  .body{min-height:0}
}
</style>
</head>

{id:'s7',tab:'S7 Reader',title:'S7 — Document reader',
 desc:'The approved artifact. A control block sits above the title, mirroring a real controlled document.',
 note:'<b>Critical steps</b> carry an amber rule — the one place a colour carries a meaning other than document state, because a safety warning outranks the rule. Everything else on the page is ink on paper so nothing competes with the procedure.',
 html: shell('ops', `<div class="reader">
  <div class="ctrl-block">
    <div class="crumb">Operations / Client delivery</div>
    <h1>Client onboarding</h1>
    <div class="ctrl-meta">
      <span class="pill p-appr">Approved</span>

      <span>Approved by Priya Menon</span>
      <span class="k">14 Aug 2026</span>
      <span>Review due Feb 2027</span>
    </div>
  </div>
  <div class="sec"><h3>Purpose</h3><p>Bring a newly signed client into delivery with the correct folder, dates and access, so the first week runs without chasing.</p></div>
  <div class="sec"><h3>Scope</h3><p>Applies to every new account after contract signature, before the kickoff call.</p></div>
  <div class="sec"><h3>Prerequisites</h3><p>Access to the Operations drive, the account channel, and the signed contract.</p></div>
  <div class="steps">
    <div class="step"><div class="n">1</div><div class="c">
      <p>In the Operations drive, open <b>Clients</b> and find the folder matching the account name.</p>
      <div class="shot">screenshot from recording</div></div></div>
    <div class="step"><div class="n">2</div><div class="c">
      <p>Right-click <b>Intake template v3</b> and duplicate it into the client folder.</p></div></div>
    <div class="step crit"><div class="n">3</div><div class="c">

  </div>

 </div>`)},

{id:'s15',tab:'S15 Ask',title:'S15 — Ask',
 desc:'Answers from approved content only, with citations back to the step they came from. Refusal is a designed state, not an error.',
 note:'<b>The refusal is the roadmap.</b> When nothing approved covers a question, the screen turns that failure into an action — request the SOP, or record it now. Every refused question is a customer telling you which document to make next.',
 html: shell('ask', `<div class="ask">
  <p class="q">How do we handle a refund requested after 30 days?</p>
  <div class="ans">
    <p>Refunds after 30 days aren't automatic. The support agent raises it with the ops lead, who approves or declines based on account standing and the reason given <a href="#" class="chip">Refund policy <span class="s">step:4</span></a>.</p>
    <p>If approved, process it as a goodwill credit rather than a card refund, so the original transaction stays intact for reconciliation <a href="#" class="chip">Refund policy <span class="s">step:6</span></a>. Log the decision in the account note the same day <a href="#" class="chip">Account hygiene <span class="s">step:2</span></a>.</p>
  </div>
  <div class="srcs">
    <h4>Answered from</h4>
    <div class="src"><span class="pill p-appr">Approved</span> Refund policy <span class="mono muted">v7</span> <span class="muted">· Finance</span></div>
    <div class="src"><span class="pill p-appr">Approved</span> Account hygiene <span class="mono muted">v2</span> <span class="muted">· Operations</span></div>
  </div>
  <div class="rate">Was this useful? <button>Yes</button><button>No</button></div>

  <div style="margin-top:34px;padding-top:16px;border-top:1px dashed var(--line);font-size:11.5px;color:#8A94A0">A different question — nothing approved covers it</div>
  <div class="refusal">
    <p class="rh">No approved document covers this yet</p>
    <p>The closest match is <b>Client onboarding v4</b>, which doesn't address contract cancellation. Nothing approved answers your question, so there's no answer to give.</p>
    <div class="row">
      <button class="btn">Record it now</button>
      <button class="btn ghost">Ask Priya to write it</button>
    </div>
  </div>
 </div>`)},

const stage = document.getElementById('stage');
const picker = document.getElementById('picker');

SCREENS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.textContent=s.tab; b.dataset.t=s.id;
  b.setAttribute('aria-current', i===0?'true':'false');
  b.onclick=()=>show(s.id);
  picker.appendChild(b);

  const d=document.createElement('section');
  d.className='screen'+(i===0?' on':''); d.id=s.id;
  d.innerHTML=`<div class="screen-head"><h2>${s.title}</h2><p>${s.desc}</p></div>
    <div class="frame">${s.html}</div>
    <div class="note">${s.note}</div>`;
  stage.appendChild(d);
});

function show(id){
  document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on', e.id===id));
  picker.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.t===id)));
  window.scrollTo({top:0,behavior:'instant'});
}

/* draft-review interactivity: segments and steps bound both ways */
document.querySelectorAll('#s9 .seg').forEach((seg,i)=>{
  seg.onclick=()=>{
    document.querySelectorAll('#s9 .seg').forEach(s=>s.classList.remove('act'));
    seg.classList.add('act');
    const steps=document.querySelectorAll('#s9 .dstep');
    steps.forEach(s=>s.classList.remove('act'));
    if(steps[i]) steps[i].classList.add('act');
  };
});
document.querySelectorAll('#s9 .dstep').forEach((st,i)=>{
  st.onclick=()=>{
    document.querySelectorAll('#s9 .dstep').forEach(s=>s.classList.remove('act'));
    st.classList.add('act');
    const segs=document.querySelectorAll('#s9 .seg');
    segs.forEach(s=>s.classList.remove('act'));
    if(segs[i]) segs[i].classList.add('act');
  };
});
document.querySelectorAll('#s9 .vbtn').forEach(b=>{
  b.onclick=e=>{
    e.stopPropagation();
    if(b.classList.contains('done')) return;
    b.classList.add('done'); b.textContent='Verified';
    const done=document.querySelectorAll('#s9 .vbtn.done').length+2;
    document.querySelector('#s9 .vcount').textContent=`${Math.min(done,9)} of 9 verified`;
    const left=9-Math.min(done,9);
    const hint=document.querySelector('#s9 .dr-foot .hint');
    const submit=document.querySelector('#s9 .dr-foot .btn');
    if(left<=0){hint.textContent='All steps verified';submit.disabled=false;}
    else hint.textContent=`${left} steps still to verify`;
  };
});
</script>
</body>
</html>
