<style>
:root{
  --ink:#1E2761; --ink-soft:#5B6B7C; --paper:#FFFFFF; --rail:#F2F4F6; --select:#CADCFC; --brand-gold:#D9A441;
  --line:#DDE2E7; --line-soft:#EBEEF1;
  --draft:#B8730B; --review:#1F5C99; --approved:#2F6F4E; --archived:#8A94A0;
  --danger:#A32B2B;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{overflow:hidden;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--select)}

/* ============ index drawer ============ */
#idxBtn{position:fixed;left:14px;bottom:14px;z-index:120;background:var(--ink);color:#fff;
  border-radius:5px;padding:9px 14px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(30,39,97,.28)}
#idx{position:fixed;inset:0;z-index:130;background:rgba(30,39,97,.55);display:none}
#idx.on{display:block}
#idxPanel{position:absolute;right:0;top:0;bottom:0;width:330px;background:var(--paper);
  padding:20px;overflow-y:auto;box-shadow:-2px 0 16px rgba(30,39,97,.2)}
#idxPanel h3{margin:0 0 3px;font-size:15px}
#idxPanel .hint{color:var(--ink-soft);font-size:12px;margin:0 0 16px}
#idxPanel .grp{font-size:10.5px;color:#939DA8;margin:16px 0 5px;font-weight:600}
#idxPanel a{display:block;padding:6px 9px;text-decoration:none;font-size:12.5px;border-radius:4px;color:#3C4A58}
#idxPanel a:hover{background:var(--rail)}
#idxPanel a b{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-right:8px}

/* ============ shell ============ */
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:14px;flex:none}
.ws{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}
.ws .mark{width:26px;height:26px;border-radius:5px;flex:none;display:block;object-fit:contain}
.brand-lockup{width:400px;max-width:100%;height:auto;display:block;margin-bottom:30px}
.omni{flex:1;max-width:470px;border:1px solid var(--line);border-radius:4px;padding:7px 12px;font-size:12.5px;background:#FCFDFD}
.omni::placeholder{color:#9AA4AE}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--rail);border:1px solid var(--line);
  margin-left:auto;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-soft);flex:none}
.limitbar{background:#FDF7EC;border-bottom:1px solid #EBD5AE;padding:7px 16px;font-size:12.5px;color:#7A5410;display:flex;gap:10px;align-items:center}
.limitbar button{font-size:12px;text-decoration:underline;color:#5E400C}
.body{display:flex;flex:1;min-height:0}
.side{width:194px;flex:none;border-right:1px solid var(--line);background:var(--rail);padding:10px 0;font-size:12.5px;overflow-y:auto}
.side a{display:block;padding:6px 14px;color:#3C4A58;text-decoration:none;cursor:pointer}
.side a:hover{background:#E8ECEF}
.side a.sel{background:#E2E7EB;color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--ink)}
.side .grp{padding:12px 14px 3px;font-size:10.5px;color:#939DA8}
.side .kid{padding-left:28px;color:#55616E}
.side hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.main{flex:1;min-width:0;overflow-y:auto;background:var(--paper);display:flex;flex-direction:column}

/* ============ atoms ============ */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.p-approved{color:var(--approved);border-color:#BEDACB;background:#F1F8F4}
.p-draft{color:var(--draft);border-color:#EBD5AE;background:#FDF7EC}
.p-in_review{color:var(--review);border-color:#C2D6E9;background:#EFF5FA}
.p-archived{color:var(--archived);border-color:var(--line);background:#F7F8F9}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:4px;padding:6px 13px;font-size:12.5px;font-weight:500}
.btn:hover{background:#2A3576}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--rail);border-color:#B6BEC7}
.btn.danger{background:transparent;color:var(--danger);border-color:#E2C4C4}
.btn:disabled{opacity:.35;cursor:not-allowed;background:var(--ink)}
.btn.ghost:disabled{background:transparent}
.pad{padding:24px 28px 60px}
.h{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 20px}
.mono{font-family:var(--mono);font-size:11.5px}
.muted{color:var(--ink-soft)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:#4A5765;padding:9px 12px;border-bottom:1px solid var(--line);background:#F8FAFB;font-size:11.5px}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover td{background:#F4F7FD}
.link{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.crumb{font-size:11px;color:#8A94A0;margin-bottom:7px}
.crumb span{cursor:pointer}
.crumb span:hover{text-decoration:underline}
.empty{border:1px dashed var(--line);border-radius:5px;padding:34px 26px;text-align:center;color:var(--ink-soft);font-size:13px}
.empty p{margin:0 0 14px}
.banner{padding:10px 16px;font-size:12.5px;border-radius:4px;margin-bottom:16px}
.b-draft{background:#FDF7EC;border:1px solid #EBD5AE;color:#7A5410}
.b-info{background:#F4F6F8;border:1px solid var(--line);color:#42505E}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip-f{border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:11.5px;color:var(--ink-soft);cursor:pointer}
.chip-f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:5px;font-size:12.5px;z-index:200;box-shadow:0 3px 14px rgba(30,39,97,.3)}

/* ============ reader ============ */
.reader{max-width:720px;margin:0 auto;padding:28px 30px 80px}
.ctrl-block{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:24px}
.ctrl-block h1{font-size:27px;letter-spacing:-.025em;margin:0 0 12px;font-weight:600}
.ctrl-meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:11.5px;color:var(--ink-soft)}
.ctrl-meta .k{font-family:var(--mono);font-size:11px;color:var(--ink)}
.sec{margin-bottom:20px}
.sec h3{font-size:11.5px;color:#7C8794;font-weight:600;margin:0 0 5px}
.sec p{margin:0;font-size:13.5px;line-height:1.62}
.steps{margin-top:28px;border-top:1px solid var(--line);padding-top:22px}
.step{display:flex;gap:15px;margin-bottom:24px}
.step .n{flex:none;width:25px;height:25px;border:1px solid var(--line);border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.step .c{flex:1;min-width:0}
.step .c p{margin:0 0 8px;font-size:13.5px;line-height:1.62}
.shot{height:108px;background:#EFF2F4;border:1px solid var(--line);border-radius:3px;display:flex;
  align-items:center;justify-content:center;color:#A4AEB8;font-size:11px}
.step.crit .c{border-left:2px solid var(--draft);padding-left:14px}
.step.crit .warn{font-size:11.5px;color:var(--draft);font-weight:600;margin-top:6px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.doc-actions{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:9px;align-items:center;z-index:5}

/* ============ editor ============ */
.ed-canvas{max-width:680px;margin:0 auto;padding:24px 22px 80px}
.slot{border:1px dashed var(--line);border-radius:4px;padding:11px 13px;margin-bottom:12px}
.slot .sl{font-size:10.5px;color:#939DA8;margin-bottom:4px}
.slot [contenteditable]{outline:none;font-size:13px;min-height:19px}
.estep{display:flex;gap:11px;align-items:flex-start;padding:9px;border-radius:4px;margin-bottom:3px}
.estep:hover{background:#F8FAFB}
.grip{color:#C2CAD2;font-size:13px;flex:none;width:11px;cursor:grab;padding-top:2px}
.estep .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);flex:none;width:16px;padding-top:2px}
.estep .txt{flex:1;font-size:13px;line-height:1.55;outline:none}
.acts{display:flex;gap:5px;opacity:0;flex:none}
.estep:hover .acts,.estep:focus-within .acts{opacity:1}
.acts button{border:1px solid var(--line);background:#fff;border-radius:3px;padding:2px 7px;font-size:10.5px;color:var(--ink-soft)}
.acts button.on{border-color:var(--draft);color:var(--draft);font-weight:600}
.saved{margin-left:auto;color:var(--ink-soft);font-size:11.5px}

/* ============ draft review ============ */
.dr{display:flex;flex:1;min-height:0}
.dr-l{width:50%;min-height:0;border-right:1px solid var(--line);background:#F8FAFB;padding:16px;display:flex;flex-direction:column}
.video{flex:1;background:#1B2733;border-radius:4px;display:flex;align-items:center;justify-content:center;
  color:#7E8E9E;font-size:12.5px;min-height:200px;font-family:var(--mono)}
.scrub{margin-top:14px}
.scrub .track{display:flex;gap:2px;height:28px}
.scrub .seg{flex:1;background:#DFE4E9;border-radius:2px;position:relative;cursor:pointer}
.scrub .seg:hover{background:#CBD3DA}
.scrub .seg.act{background:var(--ink)}
.scrub .seg.ver{background:#CFE3D8}
.scrub .seg.ver.act{background:var(--approved)}
.scrub .seg span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10px;color:#6E7C89}
.scrub .seg.act span{color:#fff}
.scrub .tl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:#8A94A0;margin-top:5px}
.dr-r{width:50%;display:flex;flex-direction:column}
.dr-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.vcount{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-left:auto}
.dr-body{flex:1;overflow-y:auto;padding:14px 16px}
.dstep{border:1px solid var(--line);border-radius:4px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
.dstep.act{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dstep .t{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dstep .num{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.dstep .ts{font-family:var(--mono);font-size:10.5px;color:#8A94A0;margin-left:auto}
.dstep .body{font-size:12.5px;line-height:1.55;outline:none}
.vbtn{margin-top:9px;background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px 10px;font-size:11px;color:var(--ink-soft)}
.vbtn.done{border-color:#BEDACB;background:#F1F8F4;color:var(--approved);font-weight:600}
.lowconf{font-size:11px;color:var(--draft);margin-top:7px;font-weight:600}
.dr-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#FAFBFC;flex:none}
.dr-foot .hint{font-size:11.5px;color:var(--ink-soft)}

/* ============ ask / search ============ */
.ask{max-width:680px;margin:0 auto;padding:26px 24px 90px}
.qa{margin-bottom:30px}
.q{font-size:15px;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
.ans{font-size:13.5px;line-height:1.68}
.ans p{margin:0 0 11px}
.cite{display:inline-flex;align-items:center;gap:4px;background:#F1F4F6;border:1px solid var(--line);
  border-radius:3px;padding:1px 6px;font-size:11px;cursor:pointer;white-space:nowrap;vertical-align:baseline}
.cite:hover{border-color:var(--ink)}
.cite .s{font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.srcs{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.srcs h4{font-size:11.5px;color:#7C8794;margin:0 0 9px;font-weight:600}
.src{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.rate{margin-top:16px;display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--ink-soft)}
.rate button{border:1px solid var(--line);border-radius:3px;padding:2px 10px;font-size:12px}
.rate button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.refusal{border:1px solid #EBD5AE;background:#FDF9F1;border-radius:4px;padding:16px 18px}
.refusal .rh{font-weight:600;font-size:13.5px;margin:0 0 8px;color:var(--draft)}
.refusal p{margin:0 0 13px;font-size:13px;line-height:1.6;color:#4A5765}
.askbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 24px}
.askbar input{width:100%;border:1px solid var(--line);border-radius:4px;padding:9px 12px;font-size:13px}
.res{padding:15px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.res:hover h4{text-decoration:underline}
.res h4{margin:0 0 5px;font-size:14px;font-weight:600}
.res p{margin:0 0 7px;font-size:12.5px;color:#4A5765;line-height:1.55}
.res .m{font-size:11.5px;color:var(--ink-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.instant{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:0 4px 4px 0;
  padding:15px 17px;background:#FAFBFC;margin-bottom:10px}
.instant p{margin:0 0 10px;font-size:13.5px;line-height:1.62}
.searchlayout{display:flex;gap:26px}
.filters{width:170px;flex:none}
.filters h5{font-size:11px;color:#7C8794;margin:0 0 7px;font-weight:600}
.filters label{display:block;font-size:12.5px;padding:3px 0;color:#42505E;cursor:pointer}

/* ============ misc ============ */
.diffl{padding:9px 12px;border-radius:3px;margin-bottom:5px;font-size:12.5px;line-height:1.55;border-left:2px solid transparent}
.diffl.add{background:#F1F8F4;border-left-color:var(--approved)}
.diffl.del{background:#FBF2F2;border-left-color:var(--danger);text-decoration:line-through;color:#8A7373}
.diffl.mov{background:#EFF5FA;border-left-color:var(--review)}
.diffl .tag{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-right:9px}
.hist{display:flex;flex:1;min-height:0}
.hist-l{width:260px;border-right:1px solid var(--line);overflow-y:auto;flex:none}
.vrow{padding:12px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12.5px}
.vrow:hover{background:#FAFBFC}
.vrow.sel{background:#F1F4F6;box-shadow:inset 2px 0 0 var(--ink)}
.vrow .vn{font-family:var(--mono);font-size:11.5px;font-weight:600}
.vrow .vm{color:var(--ink-soft);font-size:11.5px;margin-top:3px}
.hist-r{flex:1;padding:22px 26px;overflow-y:auto}
.bars{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap}
.bar-g{flex:1;min-width:190px}
.bar-g h4{font-size:11.5px;color:#7C8794;margin:0 0 11px;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.bar .l{width:82px;color:var(--ink-soft);flex:none}
.bar .t{flex:1;height:15px;background:#F0F3F5;border-radius:2px;overflow:hidden}
.bar .f{display:block;height:100%;border-radius:2px}
.bar .v{width:36px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.gap{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.gap .cnt{font-family:var(--mono);font-size:12px;color:var(--ink-soft);width:36px;flex:none}
.gap .qq{flex:1;font-size:13px}
.insp{border:1px solid var(--line);border-radius:4px;padding:16px 18px;background:#FAFBFC;margin-top:22px}
.insp h4{margin:0 0 12px;font-size:13px;font-weight:600}
.why{display:flex;gap:12px;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--line-soft)}
.why:last-child{border:0}
.why .src-t{font-size:11px;color:var(--ink-soft);width:124px;flex:none}
.prog{width:96px;height:5px;background:#E6EAEE;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .4s}
.fail{color:var(--danger);font-size:11.5px;margin-top:4px}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.toggle .tinfo{flex:1}
.toggle .tinfo b{font-size:13px;display:block;margin-bottom:3px}
.toggle .tinfo span{font-size:12px;color:var(--ink-soft)}
.sw{width:38px;height:22px;border-radius:20px;background:#CFD6DC;position:relative;flex:none;transition:background .15s;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--approved)}
.sw.on::after{left:18px}
.sw.fixed{opacity:.5;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(30,39,97,.5);z-index:110;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--paper);border-radius:6px;max-width:520px;width:100%;padding:24px;max-height:86vh;overflow-y:auto}
.modal h3{margin:0 0 6px;font-size:17px;letter-spacing:-.015em}
.modal p.m{margin:0 0 18px;color:var(--ink-soft);font-size:12.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:#7C8794;margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:8px 11px;font-size:13px}
.centered{max-width:430px;margin:0 auto;padding:80px 24px;width:100%;overflow-y:auto}
.centered h2{font-size:24px;letter-spacing:-.025em;margin:0 0 8px}
.centered p.lead{color:var(--ink-soft);margin:0 0 26px;font-size:13.5px}
.firstrun{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:0 30px}
.firstrun h2{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:0 0 10px}
.firstrun p.lead{color:var(--ink-soft);max-width:44ch;margin:0 0 28px;font-size:14px}
.rec-btn{background:var(--ink);color:#fff;border-radius:5px;padding:13px 26px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#E5534B}
.egs{margin-top:32px;color:#7C8794;font-size:12.5px;line-height:2.1}
.egs button{color:var(--ink);border-bottom:1px solid var(--line)}
.egs button:hover{border-color:var(--ink)}

@media(max-width:1024px){
  .side{display:none}
  .dr,.hist{flex-direction:column;height:auto}
  .dr-l,.dr-r,.hist-l{width:100%;border-right:none;border-bottom:1px solid var(--line)}
  .searchlayout{flex-direction:column}
  .filters{width:100%}
}
</style>
</head>

const canEdit    = () => S.user.role!=="reader";
const canApprove = () => ["admin","approver"].includes(S.user.role);
const isAdmin    = () => S.user.role==="admin";
const doc = id => S.docs.find(d=>d.id===id);
const rec = id => S.recordings.find(r=>r.id===id);
const spaceName = id => (S.spaces.find(s=>s.id===id)||{}).name || "";
const folderName = (sp,f) => { const s=S.spaces.find(x=>x.id===sp); if(!s||!f) return null;
  const fo=s.folders.find(x=>x.id===f); return fo?fo.name:null; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stateLabel = {approved:"Approved", draft:"Draft", in_review:"In review", archived:"Archived"};
const pill = st => `<span class="pill p-${st}">${stateLabel[st]}</span>`;

let toastTimer;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(), 2600);
}
function go(hash){ location.hash = hash; }

  <div class="top">

      </select></label>

  const inner = `<div class="pad">
    <div class="crumb"><span data-nav="#/s/${spid}">${esc(sp.name)}</span>${fid?" / "+esc(folderName(spid,fid)):""}</div>

    <p class="sub">${list.length} document${list.length===1?"":"s"}</p>
    ${canEdit()?`<div class="row" style="margin-bottom:16px">
      <button class="btn" data-act="openRecord">Record a process</button>
      <button class="btn ghost" data-act="newDoc" data-sp="${spid}" data-fd="${fid||""}">New document</button>
    </div>`:""}
    <div class="chips">
      ${["all","approved","in_review","draft"].map(f=>
        `<button class="chip-f ${browseFilter===f?'on':''}" data-act="filter" data-f="${f}">${

        <td><b>${esc(d.title)}</b></td><td>${pill(d.state)}</td><td class="muted">${esc(d.owner)}</td>
        <td class="muted">${d.approvedAt||"—"}</td><td class="muted">${d.reviewDue||"—"}</td></tr>`).join("")}
      </tbody></table>`
    : `<div class="empty"><p>Nothing here yet.</p>
        <div class="row" style="justify-content:center">
          <button class="btn" data-act="openRecord">Record a process</button>
          <button class="btn ghost" data-act="newDoc" data-sp="${spid}" data-fd="${fid||""}">Create a document</button>
        </div></div>`}

  return shell(inner, fid?("fd:"+fid):("sp:"+spid));
};

        canApprove()?`<button class="link" data-nav="#/d/${d.id}/review">Review it</button>`:""}</div>` :
    d.requiresAck && !d.acknowledged ? `<div class="banner b-draft">You haven't confirmed you've read this.
        <button class="link" data-act="ack" data-id="${d.id}">Confirm now</button></div>` : "";
  const inner = `
  <div class="doc-actions">
    ${canEdit()? (d.state!=="draft"
        ?`<button class="btn ghost" data-nav="#/d/${d.id}/edit">Edit</button>`

    ${d.source&&canEdit()?`<button class="btn ghost" data-nav="#/r/${d.source}/draft">Watch source</button>`:""}
  </div>
  <div class="reader">
    ${banner}

/* ---- S9 draft review ---- */
let drSel = 0;
V.draftReview = (rid) => {
  const r = rec(rid);
  if(!r || !r.steps) return shell(`<div class="pad"><div class="empty">
    <p>This recording has no generated draft yet.</p>
    <button class="btn ghost" data-nav="#/recordings">Back to recordings</button></div></div>`,"rec");
  const verified = r.steps.filter(s=>s.verified).length;
  const total = r.steps.length;
  const done = verified===total;
  const inner = `<div class="dr">
    <div class="dr-l">
      <div class="video">▶ ${esc(r.title)} · ${r.len} · at ${r.steps[drSel].ts}</div>
      <div class="scrub"><div class="track">
        ${r.steps.map((s,i)=>`<div class="seg ${i===drSel?'act':''} ${s.verified?'ver':''}"
           data-act="drSeg" data-i="${i}"><span>${i+1}</span></div>`).join("")}
      </div>
      <div class="tl"><span>00:00</span><span>${r.len}</span></div></div>
      <p style="font-size:11.5px;color:#7C8794;margin:12px 0 0">
        Each segment is one generated step. Click a segment to jump the video, or a step to scroll the draft.</p>
    </div>
    <div class="dr-r">
      <div class="dr-head">${pill("draft")}<b style="font-size:12.5px">${esc(r.title)}</b>
        <span class="vcount">${verified} of ${total} verified</span></div>
      <div class="dr-body" id="drBody">
        ${r.steps.map((s,i)=>`<div class="dstep ${i===drSel?'act':''}" data-act="drStep" data-i="${i}">
          <div class="t"><span class="num">${i+1}</span>
            <span style="font-size:12px;font-weight:600">${esc(s.t)}</span>
            <span class="ts">${s.ts}</span></div>
          <div class="body" contenteditable data-act="drEdit" data-i="${i}">${esc(s.body)}</div>
          ${s.low && !s.verified?`<div class="lowconf">Low confidence — narration was unclear here</div>`:""}
          <button class="vbtn ${s.verified?'done':''}" data-act="drVerify" data-i="${i}">${
            s.verified?"Verified":"Mark verified"}</button>
        </div>`).join("")}
      </div>
      <div class="dr-foot">
        <button class="btn" data-act="drSubmit" data-r="${r.id}" ${done?"":"disabled"}>Submit for approval</button>
        <button class="btn ghost" data-nav="#/recordings">Save draft</button>
        <span class="hint">${done?"All steps verified":(total-verified)+" step"+(total-verified===1?"":"s")+" still to verify"}</span>
      </div>
    </div></div>`;

/* ---- S13 history ---- */
let histSel = 0;
V.history = (id) => {
  const d = doc(id); if(!d) return shell(`<div class="pad">Not found.</div>`,"");
  if(!d.versions.length) return shell(`<div class="pad"><div class="empty">
    <p>${esc(d.title)} has no approved versions yet.</p>

  const v = d.versions[histSel] || d.versions[0];
  const prev = d.versions[histSel+1];
  const inner = `<div class="hist">
    <div class="hist-l">
      ${d.versions.map((x,i)=>`<div class="vrow ${i===histSel?'sel':''}" data-act="histSel" data-i="${i}">

    <div class="hist-r">
      <div class="row" style="margin-bottom:18px">
        <span style="font-size:13px;font-weight:600">Comparing</span>

        <span class="mono">v${v.n}</span>
        <button class="btn ghost" style="margin-left:auto" data-nav="#/d/${d.id}">View full document</button>
        <button class="btn ghost" data-act="restore" data-id="${d.id}" data-v="${v.n}">Restore v${v.n}</button>

  const q = searchQ.toLowerCase().trim();

  if(q) hits = hits.filter(d =>
    (d.title+" "+d.purpose+" "+d.steps.map(s=>s.t).join(" ")).toLowerCase().includes(q.split(" ")[0]) ||
    (q.includes("refund") && d.id==="d2") || (q.includes("refund") && d.id==="d3") ||
    (q.includes("client") && d.id==="d1"));
  const instant = q.includes("refund");
  const inner = `<div class="pad">
    <input class="omni" id="sq" style="max-width:520px;margin-bottom:20px" value="${esc(searchQ)}">
    <div class="searchlayout">

          <span class="muted" style="font-size:11.5px">Answered from 1 approved document</span></div></div>`:""}
        <div style="font-size:11.5px;color:#7C8794;margin:18px 0 4px">${hits.length} document${hits.length===1?"":"s"}</div>
        ${hits.length? hits.map(d=>`<div class="res" data-nav="#/d/${d.id}">
          <h4>${esc(d.title)}</h4><p>${esc(d.purpose)}</p>
          <div class="m">${pill(d.state)}<span class="mono">v${d.version}</span>
            <span>${esc(d.owner)}</span><span>${esc(spaceName(d.space))}</span></div></div>`).join("")

             Ask an owner to record it — or record it yourself.</p>
             <button class="btn" data-act="openRecord">Record it now</button></div>`}

        : `<span class="cite" data-act="openCite" data-doc="${p.c.doc}" data-ref="${p.c.ref.split(":")[1]}">${

    <select><option>Every 6 months</option><option>Every 12 months</option><option>No cadence</option></select></div>
  <h3 style="font-size:13px;margin:30px 0 8px;color:var(--danger)">Delete workspace</h3>
  <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px">
    Removes every document, recording and version. This cannot be undone.</p>
  <button class="btn danger" data-act="deleteWs">Delete this workspace</button>
</div>`, "adm");

/* ---- S24 account ---- */
V.account = () => {
  const labels = {review:"Review requested", changes:"Changes requested on my draft",
    approved:"My document was approved", ack:"A policy needs my confirmation", digest:"Weekly digest"};
  const inner = `<div class="pad" style="max-width:600px">
    <h2 class="h">Account</h2>
    <p class="sub">${esc(S.user.email)}</p>
    <div class="field"><label>Name</label><input value="${esc(S.user.name)}"></div>
    <h3 style="font-size:13px;margin:26px 0 4px">Notifications</h3>
    ${Object.keys(labels).map(k=>`<div class="toggle"><div class="tinfo"><b>${labels[k]}</b>
      ${k==="ack"?`<span>Can't be turned off — a policy confirmation is a compliance record.</span>`:""}</div>
      <div class="sw ${S.notifPrefs[k]?'on':''} ${k==="ack"?'fixed':''}" ${k==="ack"?"":`data-act="notif" data-k="${k}"`}></div></div>`).join("")}
    <h3 style="font-size:13px;margin:26px 0 10px">Active sessions</h3>
    <table><tbody>
      <tr><td>Chrome · macOS</td><td class="muted">Now</td><td class="muted">This device</td></tr>
      <tr><td>Safari · iPhone</td><td class="muted">Yesterday</td><td><button class="link" data-act="signOutDevice">Sign out</button></td></tr>
    </tbody></table></div>`;
  return shell(inner, "");
};

/* =====================================================================
   ROUTER
   ===================================================================== */
function render(){
  const h = (location.hash || "#/s/ops").slice(1);
  const p = h.split("/").filter(Boolean);
  let html;
  if(p[0]==="auth") html = V.auth();
  else if(p[0]==="onboard" && p[1]==="workspace") html = V.newWorkspace();
  else if(p[0]==="onboard" && p[1]==="invite") html = V.invite();
  else if(p[0]==="onboard" && p[1]==="first") html = V.firstRun();
  else if(p[0]==="s") html = V.space(p[1], p[2]);
  else if(p[0]==="d" && p[2]==="edit") html = V.editor(p[1]);
  else if(p[0]==="d" && p[2]==="review") html = V.review(p[1]);
  else if(p[0]==="d" && p[2]==="history") html = V.history(p[1]);
  else if(p[0]==="d") html = V.reader(p[1]);
  else if(p[0]==="r" && p[2]==="draft") html = V.draftReview(p[1]);
  else if(p[0]==="recordings") html = V.recordings();
  else if(p[0]==="ask") html = V.ask();
  else if(p[0]==="search") html = V.search();
  else if(p[0]==="handbook") html = V.handbook();
  else if(p[0]==="admin" && p[1]==="acks") html = V.acks();
  else if(p[0]==="admin" && p[1]==="members") html = V.members();
  else if(p[0]==="admin" && p[1]==="spaces") html = V.permissions();
  else if(p[0]==="admin" && p[1]==="insights") html = V.insights();
  else if(p[0]==="admin" && p[1]==="audit") html = V.audit();
  else if(p[0]==="admin" && p[1]==="billing") html = V.billing();
  else if(p[0]==="admin" && p[1]==="settings") html = V.settings();
  else if(p[0]==="account") html = V.account();
  else html = V.space("ops");
  document.getElementById("app").innerHTML = html;
  const hash = location.hash;
  if(hash.includes("#step-")) {} // reader anchors handled inline
}
window.addEventListener("hashchange", render);

/* =====================================================================
   INTERACTION
   ===================================================================== */
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]");
  const act = e.target.closest("[data-act]");
  if(act) { handle(act.dataset.act, act, e); return; }
  if(nav) { go(nav.dataset.nav); }
});

document.addEventListener("change", e=>{
  const a = e.target.closest("[data-act]");
  if(!a) return;
  if(a.dataset.act==="roleChange"){
    const m = S.members[+a.dataset.i];
    const old = m.role; m.role = a.value;
    toast(`${m.name} is now ${m.role} — ${m.role==="Approver"?"they can approve documents in their spaces":"permissions updated"}.`);
    S.audit.unshift({ts:"2026-09-08 10:02", who:S.user.name, act:"member.role_changed",
      ent:m.name, d:`${old} to ${m.role}`});
  }
  if(a.dataset.act==="inspect"){ inspectPerson = a.value; render(); }
});

document.addEventListener("change", e=>{
  if(e.target.id!=="whoami") return;
  const p = S.people.find(x=>x.name===e.target.value);
  if(!p) return;
  S.user = p;
  const h = location.hash;
  const blocked = (!canEdit() && (h.includes("/edit")||h.startsWith("#/recordings")||h.includes("/draft")))
               || (!canApprove() && h.includes("/review"))
               || (!isAdmin() && h.startsWith("#/admin"));
  if(blocked) go("#/s/ops"); else render();
  toast(`Viewing as ${p.name} — ${p.role}.`);
});

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="askIn"){ ask(e.target.value); e.target.value=""; }
  if(e.key==="Enter" && e.target.id==="omni"){
    const q=e.target.value.trim(); if(!q) return;
    if(/\?$|^(how|what|who|when|where|why|can|do|does|is)\b/i.test(q)){ ask(q); go("#/ask"); }
    else { searchQ=q; go("#/search"); }
  }
  if(e.key==="Enter" && e.target.id==="sq"){ searchQ=e.target.value; render(); }
  if((e.metaKey||e.ctrlKey) && e.key==="k"){ e.preventDefault();
    const o=document.getElementById("omni"); if(o) o.focus(); }
});

function ask(q){
  q = (q||"").trim(); if(!q) return;
  const lower = q.toLowerCase();
  if(lower.includes("refund")) askThread.push({q, a:S.answers.refund});
  else if(lower.includes("client")||lower.includes("onboard")||lower.includes("sign"))
    askThread.push({q, a:S.answers.onboarding});
  else askThread.push({q, refused:true, near:"Client onboarding v4"});
  if(location.hash!=="#/ask") go("#/ask"); else render();
  setTimeout(()=>{ const m=document.getElementById("main"); if(m) m.scrollTop=m.scrollHeight; },30);
}

function handle(a, el, ev){
  const i = +el.dataset.i;
  switch(a){
    case "filter": browseFilter = el.dataset.f; render(); break;

    case "openRecord": openRecordModal(); break;

    case "newDoc": {
      const id = "d"+(S.docs.length+1);
      S.docs.push({id, title:"Untitled procedure", space:el.dataset.sp, folder:el.dataset.fd||null,
        state:"draft", version:0, owner:S.user.name, purpose:"", scope:"", prereq:"",
        steps:[{t:"First step"}], versions:[]});
      go("#/d/"+id+"/edit"); break;
    }

    /* --- draft review --- */
    case "drSeg": case "drStep": drSel = i; render(); break;
    case "drVerify": {
      ev.stopPropagation();
      const r = rec(location.hash.split("/")[2]);
      r.steps[i].verified = true; drSel = i; render();
      const left = r.steps.filter(s=>!s.verified).length;
      if(left===0) toast("All steps verified. You can submit this for approval.");
      break;
    }
    case "drEdit": ev.stopPropagation(); break;
    case "drSubmit": {
      const r = rec(el.dataset.r);
      const d = doc(r.draft);
      if(d){ d.state="in_review"; d.submittedBy=S.user.name; d.submittedAgo="just now"; }
      S.audit.unshift({ts:"2026-09-08 10:05", who:S.user.name, act:"document.submitted",
        ent:d?d.title:r.title, d:"Submitted for review"});
      toast("Submitted for approval.");
      go("#/d/"+(d?d.id:"d1")+"/review"); break;
    }

    /* --- editor --- */
    case "edUp": { const d=docFromHash(); if(i>0){ const s=d.steps.splice(i,1)[0]; d.steps.splice(i-1,0,s); render(); } break; }
    case "edDown": { const d=docFromHash(); if(i<d.steps.length-1){ const s=d.steps.splice(i,1)[0]; d.steps.splice(i+1,0,s); render(); } break; }
    case "edCrit": { const d=docFromHash(); d.steps[i].critical=!d.steps[i].critical; render(); break; }
    case "edDel": { const d=docFromHash(); d.steps.splice(i,1); render(); break; }
    case "edAdd": { const d=docFromHash(); d.steps.push({t:"New step"}); render(); break; }
    case "rewrite": toast("Rewrite returns a proposal you accept or reject — it never changes the document on its own."); break;
    case "translate": toast("Creates a linked translation as a separate document. The source is untouched."); break;
    case "submit": {
      const d = doc(el.dataset.id);
      if(!d.steps.length){ toast("A procedure needs at least one step before it can be submitted."); break; }
      if(!d.purpose.trim()){ toast("Purpose is required before submitting."); break; }
      d.state="in_review"; d.submittedBy=S.user.name; d.submittedAgo="just now";
      toast("Submitted for approval."); go("#/d/"+d.id+"/review"); break;
    }

    /* --- approval --- */
    case "approve": {
      const d = doc(el.dataset.id);
      d.version = (d.version||0)+1;
      d.state = "approved";
      d.approver = S.user.name;
      d.approvedAt = "08 Sep 2026";
      d.reviewDue = "Mar 2027";
      d.versions.unshift({n:d.version, by:d.submittedBy||d.owner, at:"08 Sep 2026",
        summary:"Approved from review"});
      S.audit.unshift({ts:"2026-09-08 10:07", who:S.user.name, act:"document.approved",
        ent:`${d.title} v${d.version}`, d:"Approved and published"});
      toast(`Published as v${d.version}. This is now what the chatbot answers from.`);
      go("#/d/"+d.id); break;
    }
    case "requestChanges": {
      const d = doc(el.dataset.id);
      d.state = "draft";
      S.audit.unshift({ts:"2026-09-08 10:06", who:S.user.name, act:"document.changes_requested",
        ent:d.title, d:"Returned to draft"});
      toast("Sent back to draft with your comment.");
      go("#/d/"+d.id); break;
    }

    /* --- history --- */
    case "histSel": histSel = i; render(); break;
    case "restore": {
      const d = doc(el.dataset.id);
      toast(`Restored v${el.dataset.v} as a new draft. v${d.version} stays live until the draft is approved.`);
      break;
    }

    /* --- ask / search --- */
    case "askEg": ask(el.dataset.q); break;
    case "rate": S.ratings[i] = el.dataset.v; render(); break;
    case "openCite": {
      go("#/d/"+el.dataset.doc);
      setTimeout(()=>{ const t=document.getElementById("step-"+el.dataset.ref);
        if(t) t.scrollIntoView({block:"center"}); }, 60);
      break;
    }
    case "askAbout": go("#/ask"); break;
    case "requestSop": toast("Asked the owner to record this. It'll show in their tasks."); break;

    /* --- handbook --- */
    case "ack": {
      const d = doc(el.dataset.id); d.acknowledged = true;
      toast("Confirmed. Recorded against v"+d.version+" with today's date."); render(); break;
    }

    /* --- admin --- */
    case "removeMember": {
      const m = S.members[i];
      if(confirm(`${m.name} will immediately lose access to 47 documents and any answers drawn from them.\n\nRemove them?`)){
        S.members.splice(i,1); S.ws.seatsUsed--;
        toast(`${m.name} removed. Their access ended immediately.`); render();
      }
      break;
    }
    case "sendInvites": toast("Invites sent. They'll join with the role you picked."); break;
    case "nudge": toast(`Reminder sent to ${el.dataset.n}.`); break;
    case "exportCsv": toast("CSV exported — one row per person per document version."); break;
    case "addSeats": S.ws.seatsIncluded = S.ws.seatsUsed; toast("Seats added. You're back within your plan."); render(); break;
    case "portal": toast("Opens the payment provider's billing portal."); break;
    case "toggleSelfApproval": S.ws.selfApproval=!S.ws.selfApproval;
      toast(S.ws.selfApproval?"Owners can now approve their own submissions.":"Self-approval turned off."); render(); break;
    case "toggleRetain": S.ws.retainVideo=!S.ws.retainVideo;
      toast(S.ws.retainVideo?"Recordings will be kept.":"Video will be discarded after processing. Existing recordings are unaffected."); render(); break;
    case "notif": S.notifPrefs[el.dataset.k]=!S.notifPrefs[el.dataset.k]; render(); break;
    case "signOutDevice": toast("Signed out on that device."); break;
    case "deleteWs": toast("Deleting a workspace needs the exact name typed to confirm."); break;
    case "retry": {
      const r = rec(el.dataset.id);
      r.state="transcribing"; r.pct=8; r.reason=null; render();
      const tick=setInterval(()=>{
        r.pct+=12;
        if(r.pct>40) r.state="segmenting";
        if(r.pct>65) r.state="generating";
        if(r.pct>=100){ r.pct=100; r.state="draft_ready"; clearInterval(tick);
          toast("Draft ready for "+r.title+"."); }
        if(location.hash==="#/recordings") render();
      }, 700);
      break;
    }
  }
}
function docFromHash(){ return doc(location.hash.split("/")[2]); }

/* --- record modal --- */
function openRecordModal(){
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="box">
    <h3>Record a process</h3>
    <p class="m">We'll capture your screen and your voice. Both matter — the narration is
      what becomes the written steps.</p>
    <div style="border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:18px;background:#FAFBFC">
      <b style="font-size:12.5px;display:block;margin-bottom:6px">Your browser will ask twice</b>
      <span style="font-size:12.5px;color:var(--ink-soft)">
        First to share your screen, then to use your microphone. Allow both, or the recording
        can't become a procedure.</span>
    </div>
    <div class="field"><label>What are you recording?</label>
      <input placeholder="e.g. Onboarding a new client"></div>
    <div class="field"><label>Where should the draft go?</label>
      <select>${S.spaces.map(s=>`<option>${esc(s.name)}</option>`).join("")}</select></div>
    <div class="row"><button class="btn" data-act="startRec">Start recording</button>
      <button class="btn ghost" data-act="closeModal">Upload a file instead</button>
      <button class="btn ghost" data-act="closeModal" style="margin-left:auto">Cancel</button></div>
  </div>`;
  m.addEventListener("click", ev=>{
    const a = ev.target.closest("[data-act]");
    if(!a && ev.target===m){ m.remove(); return; }
    if(!a) return;
    if(a.dataset.act==="closeModal") m.remove();
    if(a.dataset.act==="startRec"){
      m.remove();
      toast("In the real product your browser now asks to share your screen.");
      setTimeout(()=>go("#/recordings"), 700);
    }
  });
  document.body.appendChild(m);
}
